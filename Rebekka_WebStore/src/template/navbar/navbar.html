<nav class="w-full h-20 bg-white shadow-[0px_4px_43.5px_0px_rgba(0,0,0,0.25)] flex items-center justify-between px-5 md:px-8 font-['Inter'] gap-8 overflow-hidden">
    <!-- Botón Hamburguesa (Solo Móvil) -->
  <button (click)="toggleMenu()" class="md:hidden p-1 text-black focus:outline-none" aria-label="Abrir menú">
    <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
  </button>

  <div class="w-52 h-7 justify-start">
      <img src="../assets/img/REBEKKA.png" alt="Logo" class="w-32 md:w-40 h-auto object-contain" />
    </div>

<!-- Enlaces de navegación centrado perfecto (Desktop) -->
<div class="hidden md:flex items-center gap-8 absolute left-1/2 -translate-x-1/2 text-black text-lg font-normal">
  <div class="cursor-pointer hover:opacity-75 transition-opacity">Mujer</div>
  <div class="cursor-pointer hover:opacity-75 transition-opacity">Hombre</div>
  <div class="cursor-pointer hover:opacity-75 transition-opacity">Novedades</div>
  <div class="cursor-pointer hover:opacity-75 transition-opacity">Rebajas</div>
</div>


<!-- Iconos -->
  <div class="flex items-center gap-3 md:gap-8">
    <!-- Buscador (Desktop) -->
    <div class="hidden md:block w-60 h-9 relative">
      <input type="text" placeholder="Buscar..." class="w-full h-full bg-gray-200 rounded-md px-3 pr-8 text-xs outline-none" />
      <svg class="w-4 h-4 absolute right-2.5 top-2.5 text-black pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
    </div>

    <!-- Buscador (Móvil) -->
    <button class="md:hidden p-1 text-gray-700 hover:text-black">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
    </button>

    <!-- Favoritos -->
    <!-- Icono Favoritos con Contador y Estado Activo/Rojo -->
    <button class="relative p-1 transition-colors duration-200" [class.text-red-500]="wishlistCount > 0" [class.text-gray-700]="wishlistCount === 0">
      <svg class="w-7 h-7" [attr.fill]="wishlistCount > 0 ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
      </svg>
      <!-- Badge Contador -->
      @if (wishlistCount > 0) {
        <span class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">
          {{ wishlistCount }}
        </span>
      }
    </button>

    <!-- Carrito -->
    <!-- Icono Carrito con Contador y Estado Activo/Rojo -->
  <button
    class="relative p-1 transition-colors duration-200"
    [class.text-red-500]="cartCount > 0"
    [class.text-gray-700]="cartCount === 0">

    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
    </svg>

    <!-- Badge Contador (Alineado igual al Wishlist) -->
    @if (cartCount > 0) {
      <span class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">
        {{ cartCount }}
      </span>
    }
  </button>

    <!-- Usuario (Oculto en Móvil) -->
    <button class="hidden md:block p-1 text-gray-700 hover:text-black">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
      </svg>
    </button>
  </div>

</nav>

<!-- Componente Sidebar separado -->
<app-sidebar [isOpen]="isMenuOpen" (close)="toggleMenu()"></app-sidebar>
