<!-- Overlay (Fondo oscuro) -->
@if (isOpen) {
<div (click)="onClose()" class="fixed inset-0 bg-black/50 z-50 md:hidden transition-opacity">
</div>
}

<!-- Panel Lateral -->
<aside
  class="fixed top-0 left-0 w-4/5 max-w-xs h-screen bg-white z-50 shadow-2xl flex flex-col justify-between p-6 transform transition-transform duration-300 ease-in-out md:hidden"
  [class.translate-x-0]="isOpen" [class.-translate-x-full]="!isOpen">

  <div>
    <!-- Cabecera -->
    <div class="flex justify-between items-center pb-4 border-b border-gray-200">
      <img src="../assets/img/REBEKKA.png" alt="Logo" class="w-32 md:w-40 h-auto object-contain" />
      <button (click)="onClose()" class="p-1 text-gray-500 hover:text-black">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Menú de opciones -->
    <nav class="mt-6">
      <ul class="flex flex-col gap-5 text-black text-lg font-medium g-text">
        <li><a href="#" (click)="onClose()" class="block py-1 hover:text-gray-500">Mujer</a></li>
        <li><a href="#" (click)="onClose()" class="block py-1 hover:text-gray-500">Hombre</a></li>
        <li><a href="#" (click)="onClose()" class="block py-1 hover:text-gray-500">Novedades</a></li>
        <li><a href="#" (click)="onClose()" class="block py-1 hover:text-gray-500">Rebajas</a></li>
      </ul>
    </nav>
  </div>

  <!-- Pie del Sidebar -->
  <div class="pt-4 border-t border-gray-200 flex items-center gap-3 g-text">
    <img src="../assets/img/avatar.png" alt="Usuario" class="w-6 h-6" />
    <a href="#" (click)="onClose()" class="text-sm font-medium text-black">Mi Cuenta / Iniciar Sesión</a>
  </div>

</aside>
